# Sunuwar grapheme-to-phoneme (G2P) rule table.
# Devanagari conventions approximated from standard Nepali phonetic values —
# no Sunuwar-specific phonology reference was available. Documented assumption,
# see CLAUDE.md "TTS roadmap" section.
#
# Phone symbols are plain ASCII so MFA/Kaldi never see non-ASCII phone labels.

vocab_source_dir: data/processed/audio/mfa_input
output_dict_path: data/processed/audio/mfa_dict.dict
unmapped_report_path: data/processed/audio/mfa_dict_unmapped.txt

# Characters with no phonetic content of their own — control the algorithm,
# never appear as phones themselves.
virama: "्"
zwj: "‍"
nukta: "़"
nukta_suffix: "Q"     # appended to a consonant's phone when nukta modifies it

# Marks that attach to the preceding vowel rather than standing alone.
nasal_marks: ["ं", "ँ"]     # anusvara, chandrabindu -> nasalize preceding vowel
nasal_suffix: "N"
visarga: "ः"
visarga_phone: "H"

# Independent vowel letters (word-initial / post-vowel position).
independent_vowels:
  "अ": a
  "आ": aa
  "इ": i
  "ई": ii
  "उ": u
  "ऊ": uu
  "ऋ": ri
  "ए": e
  "ऐ": ai
  "ओ": o
  "औ": au

# Matras (dependent vowel signs) — same phone value as their independent form,
# but replace a consonant's inherent /a/ instead of standing alone.
matras:
  "ा": aa
  "ि": i
  "ी": ii
  "ु": u
  "ू": uu
  "ृ": ri
  "े": e
  "ै": ai
  "ो": o
  "ौ": au

# Consonants — each carries inherent /a/ unless followed by virama or a matra.
consonants:
  "क": k
  "ख": kh
  "ग": g
  "घ": gh
  "ङ": ng
  "च": c
  "छ": ch
  "ज": j
  "झ": jh
  "ञ": ny
  "ट": tt
  "ठ": tth
  "ड": dd
  "ढ": ddh
  "ण": nn
  "त": t
  "थ": th
  "द": d
  "ध": dh
  "न": n
  "प": p
  "फ": ph
  "ब": b
  "भ": bh
  "म": m
  "य": y
  "र": r
  "ल": l
  "व": v
  "श": sh
  "ष": ssh
  "स": s
  "ह": h
  "ळ": ll

# Characters to trim from token boundaries before G2P — punctuation glued
# to word-final tokens (e.g. sentence-final danda), not part of the word.
boundary_strip_chars: "।॥.,;:!?\"'()[]—-"
