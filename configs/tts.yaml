# Phase 6 — fine-tune MMS-TTS on the Sunuwar single-speaker dataset.
#
# Defaults are tuned for the current 1.37h/18-chapter verification dataset on
# a Colab T4: this is a pipeline smoke test, not a release run. See the notes
# at the bottom for what to change once the full corpus is aligned.

project_name: sunuwar-tts-prototype

# Sunuwar has no MMS-TTS checkpoint — and neither does Nepali. Verified
# 2026-07-27: facebook/mms-tts-nep and -npi both 404, and no Nepali code
# exists under facebook/mms-tts full_models/.
#
# Maithili was selected by measuring each candidate tokenizer's character
# coverage of this dataset (34,863 chars): mai 98.65% (missing only the
# danda), hin 97.83%, mar 93.03%, non-Devanagari controls 15.51%. Maithili is
# also a Nepal contact language (Terai), so the linguistic and empirical
# choices agree. ZWJ (U+200D) is in the vocab — no ZWJ remapping needed.
base_checkpoint: facebook/mms-tts-mai

# Produced by the notebook's conversion cell — the released checkpoint has no
# discriminator, which VITS' GAN objective requires.
discriminator_checkpoint: /content/mms-tts-base-train

dataset_dir: /content/tts_dataset
output_dir: /content/drive/MyDrive/sunuwar_tts/prototype

# Set after a Colab disconnect to continue from the last save instead of
# restarting at step 0. Comment out (or remove) for a fresh run.
resume_from_checkpoint: /content/drive/MyDrive/sunuwar_tts/prototype/checkpoint-5500
finetune_repo_dir: /content/finetune-hf-vits
training_json: /content/_tts_finetune.json

# --- text / vocabulary ----------------------------------------------------
# Rewrite transcripts that fall outside the tokenizer's character inventory
# rather than letting them silently become <unk>. The notebook prints exactly
# what gets substituted before training starts.
adapt_text_to_vocab: true
danda_replacement: ""      # "।" -> dropped unless the vocab has a full stop
# character_overrides:     # force a specific substitution, e.g.
#   "।": "."

# --- training -------------------------------------------------------------
# 554 training clips at batch 8 is ~70 steps/epoch. 200 epochs ~= 14k steps,
# roughly 5h on a free T4 at the previous run's measured 1.32 s/it — near the
# edge of a single free-tier session; watch for disconnects.
batch_size: 8
eval_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
num_train_epochs: 200
warmup_ratio: 0.0
lr_scheduler_type: linear
fp16: true

max_duration_in_seconds: 20.0
min_duration_in_seconds: 1.0
preprocessing_num_workers: 2
dataloader_num_workers: 2

# GAN loss weights — the reference recipe's defaults. weight_mel dominates;
# lower it only if the voice is over-smoothed and lifeless.
weight_disc: 3.0
weight_fmaps: 1.0
weight_gen: 1.0
weight_kl: 1.5
weight_duration: 1.0
weight_mel: 35.0

# Synthesised periodically during training, so progress is audible and not
# just a loss curve. A held-out LUK_005 sentence.
sample_text: "परमप्रभु यावे आ दाक्‍शो पा"

logging_steps: 10
eval_steps: 50
# Colab sessions die without warning and output_dir is on Drive, so save
# often enough that a disconnect costs minutes, not hours.
save_steps: 250
save_total_limit: 2
report_to: []              # set to ["wandb"] once you have a run to track

# --- scaling up (after the full 260-chapter Phase 3/4/5 rerun) -------------
# ~20h of audio instead of 1.37h, roughly 15x the clips:
#   num_train_epochs: 30-50   (step count matters, not epochs)
#   batch_size: 16            (fits a T4 at these durations; use A100 if free)
#   save_steps: 1000
#   report_to: ["wandb"]
