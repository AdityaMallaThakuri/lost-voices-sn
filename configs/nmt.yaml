# Data
aligned_path: results/suz_npi_sentence_aligned.tsv
suz_tokeniser_path: models/sunuwar_spm_8k.model
npi_tokeniser_path: models/nepali_spm_4k.model

# Model architecture (Config A from the Phase 4 feasibility investigation)
hidden_dim: 256
num_heads: 4
ffn_dim: 512
num_encoder_layers: 3
num_decoder_layers: 3
max_seq_len: 128
dropout: 0.1
activation: gelu

# Training
seed: 42
epochs: 40
batch_size: 32
grad_accumulation_steps: 4
learning_rate: 0.0005
weight_decay: 0.01
warmup_ratio: 0.1
fp16: true
train_split: 0.9

# Early stopping
early_stopping_patience: 5
monitor_metric: val_loss

# Output
checkpoint_path: models/sunuwar_nmt.pt
eval_output_path: results/nmt_eval.json

# Wandb
wandb_project: lost-voices-sunuwar
wandb_run_name: sunuwarNMT-small-v1
