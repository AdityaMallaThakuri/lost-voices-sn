# Data
train_path: data/processed/train.txt
test_path: data/processed/test.txt
tokeniser_path: models/sunuwar_spm_8k.model

# Model architecture
num_layers: 6
hidden_dim: 384
num_heads: 8
ffn_dim: 1024
max_seq_len: 128
vocab_size: 8000
dropout: 0.1
activation: gelu

# Training
seed: 42
epochs: 100
batch_size: 32
grad_accumulation_steps: 4
learning_rate: 0.0005
weight_decay: 0.01
warmup_ratio: 0.1
fp16: true

# MLM
mlm_probability: 0.15
mask_ratio: 0.8
random_ratio: 0.1
unchanged_ratio: 0.1

# Early stopping
early_stopping_patience: 5
monitor_metric: val_perplexity

# Output
checkpoint_path: models/sunuwar_transformer.pt

# Wandb
# wandb_mode: online | offline | disabled
#   offline  — logs to ./wandb/ (gitignored); no account, login or network
#              needed. `wandb sync <run-dir>` uploads it afterwards, so metrics
#              are kept, not lost. This is the default because claude.md
#              requires every script to run end-to-end in Colab, and a fresh
#              runtime has no credentials.
#   online   — streams to wandb.ai. Needs `wandb login` first, or init raises
#              "UsageError: No API key configured".
#   disabled — wandb is never imported at all.
wandb_mode: offline
wandb_project: lost-voices-sunuwar
wandb_run_name: sunuwarBERT-small-v1
