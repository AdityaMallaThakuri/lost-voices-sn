# Phase 5 — build the TTS training dataset from QC-passed segments.

qc_report: results/qc_report.csv
output_dir: data/processed/tts_dataset
clean: true

sample_rate: 16000    # asserted against the source wavs, not resampled
trim_pad_s: 0.1       # keep 100ms either side of the MFA speech span
min_words: 3          # re-checked after cleaning, not just before

# Drop mangled cross-reference remnants ("१कोरिन्‍", bare verse numerals) that
# the pre-fix clean_transcripts.py left in these segment transcripts. They are
# not in the audio and not in the G2P dictionary. Once the full corpus is
# re-segmented from the fixed mfa_input/ this becomes a no-op, but it is left
# on as a safety net.
strip_unspoken_numerals: true

# Whole chapters are held out, never random segments — adjacent verses share
# phrasing, so a random split leaks near-duplicates into validation.
# One clean chapter per register, now that batch2 adds epistles to the sample:
# LUK_005 (Gospel narrative), REV_021 (apocalyptic), GAL_001 (epistle — chosen
# over ROM_008/EPH_004 because those two carry segmentation damage and would
# make the val metric noisy rather than representative).
# Comment this out and set `val_fraction` instead to pick chapters at random
# (seeded, reproducible) once the full 260-chapter corpus is aligned.
val_chapters:
  - LUK_005
  - REV_021
  - GAL_001
# val_fraction: 0.1
